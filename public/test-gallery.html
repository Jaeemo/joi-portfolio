<!DOCTYPE html>
<html>
<head><style>
  body { font-family: sans-serif; background: #eee; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .card { background: white; padding: 10px; border: 1px solid #ccc; width: 200px; }
  .card img { max-width: 100%; height: auto; }
</style></head>
<body>
<h1>Gallery</h1>
<div class="grid" id="grid"></div>
<script>
  const files = [
    "2-1.png", "2-2.png", "2-3.png", "2-4.png",
    "3-1-1.png", "3-1-2.png", "3-1-3.png",
    "3-2.png", "3-3.png", "3-4.png", "3-5.png",
    "4-1.png", "4-2.png", "4-3.png",
    "5-1.png", "5-2.png", "5-3.png",
    "6-1.jpg", "6-2.png",
    "7-1.png", "7-2.png", "7-3.png"
  ];
  const grid = document.getElementById("grid");
  files.forEach(f => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="/src/assets/RGB-commercial/${f}" /><div>${f}</div>`;
    grid.appendChild(div);
  });
</script>
</body>
</html>
